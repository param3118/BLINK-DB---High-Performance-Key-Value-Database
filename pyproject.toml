[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blinkdb"
version = "0.3.0"
description = "A local, dataset-scoped SQLite database service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "zstandard>=0.22,<1",
]

[project.scripts]
blinkdbd = "blinkdbd.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "clients" = "clients"}
packages = ["blinkdbd", "clients", "clients.python"]

[tool.ruff]
line-length = 100
